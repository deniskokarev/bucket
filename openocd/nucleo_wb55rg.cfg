# OpenOCD config for the Nucleo-WB55RG (on-board ST-LINK/V2-1).
#
# Usage:
#   Attach / sanity check:
#     openocd -f openocd/nucleo_wb55rg.cfg
#   Flash the built image manually (west flash normally does this for you):
#     openocd -f openocd/nucleo_wb55rg.cfg \
#             -c "program firm/build/zephyr/zephyr.hex verify reset exit"
#
# The upstream board file already selects the ST-LINK interface and the
# stm32wbx target, and works out of the box with Homebrew OpenOCD 0.12.0.
source [find board/st_nucleo_wb55.cfg]
