# ---- bucket firmware base config ----

CONFIG_MAIN_STACK_SIZE=2048

# Logging over the USB VCP / RTT. Cheap during bring-up; trim later for power.
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Interactive shell over the ST-LINK virtual COM port (milestone-1 bring-up).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# GPIO for the pump driver and status LED.
CONFIG_GPIO=y

# TSC capacitive sensing is exposed through the input subsystem.
# (The STM32 TSC driver is enabled by the devicetree overlay; it selects
#  CONFIG_INPUT automatically, but we ask for it explicitly for clarity.)
CONFIG_INPUT=y

# ---- Bluetooth LE (STM32WB) ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BucketEvac"
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="BucketEvac"
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Denis Kokarev"
# BT shell commands for bring-up experimentation.
CONFIG_BT_SHELL=y

# ---- Pairing / bonding ----
# Secure (encrypted) GATT access with persistent bonds. New pairings are only
# accepted during a bonding window (see src/bond.c), gated via the
# pairing-accept callback.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y

# Persist bonds in the `storage` flash partition.
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
# `settings list|read|write|delete` to inspect/wipe stored bonds (bt/keys/...).
CONFIG_SETTINGS_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
# e2e cleanup: `flash erase` the storage partition, then `kernel reboot cold`.
CONFIG_FLASH_SHELL=y
CONFIG_REBOOT=y
# `input report` injects SW1 presses (e2e drives the morse codes with it).
CONFIG_INPUT_SHELL=y

# Kernel niceties
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# The BT host's deferred settings store (bonds + CCCs -> NVS) runs on the
# system workqueue; 1 KiB overflowed when a bond with two CCCs was re-paired.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
