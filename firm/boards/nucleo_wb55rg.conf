# Board-specific Kconfig fragment for nucleo_wb55rg.
# Auto-merged with prj.conf when BOARD=nucleo_wb55rg.

# The WB55 BLE stack runs on the Cortex-M0+ radio coprocessor; the HCI link to
# it is provided by the IPM/IPC transport. Keep BT managed here so a non-BLE
# board build (e.g. for host tests) stays clean.
CONFIG_BT=y
